# Render Blueprint: the Relay Chess server (HTTP API + socket.io), staging and production.
#   main -> relay-chess-server-stage (stage-api.relaychess.com)
#   prod -> relay-chess-server       (api.relaychess.com)
# The web app deploys on Vercel (see DEPLOY.md).

x-server: &server
  type: web
  runtime: node
  region: oregon
  # Deploy after a push to the branch, but only once GitHub checks (CI) pass.
  autoDeployTrigger: checksPass
  buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @relay-chess/server...
  startCommand: cd apps/server && ./node_modules/.bin/tsx src/main.ts
  healthCheckPath: /health
  # Games live in memory, so keep exactly one instance.
  numInstances: 1
  buildFilter:
    paths:
      - apps/server/**
      - packages/game/**
      - pnpm-lock.yaml
      - render.yaml

services:
  - <<: *server
    name: relay-chess-server-stage
    branch: main
    plan: free # sleeping is fine on staging
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET # same value as Vercel's Preview AUTH_SECRET; different from prod
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME # a separate database, e.g. relaychess_stage
        sync: false
      - key: CORS_ORIGINS
        value: https://stage.relaychess.com
      - key: GUEST_LOGIN
        value: "true"

  - <<: *server
    name: relay-chess-server
    branch: prod
    plan: starter # always on: a sleeping server drops live games
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET # same value as Vercel's Production AUTH_SECRET
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME # the existing database, so users and the leaderboard carry over
        sync: false
      - key: CORS_ORIGINS
        value: https://relaychess.com,https://www.relaychess.com
      - key: GUEST_LOGIN
        value: "true"
